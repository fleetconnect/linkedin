<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_fonts.css">
<!-- 01 DEADHEAD — album cover. Type is the entire image. -->
<style>
  .a{background:#0B0B0C}
  .word{position:absolute;top:206px;left:0;right:0;text-align:center;
        font-family:'Shoulders';font-weight:700;font-size:372px;line-height:.795;
        letter-spacing:-.014em;text-transform:uppercase;}
  /* hollow letterforms: the empty trailer */
  .word span{ -webkit-text-stroke:4px #EDEAE3; color:transparent; }
  .word span.solid{ -webkit-text-stroke:0; color:#D93A2B; }

  .rule{position:absolute;left:96px;right:96px;top:922px;height:1px;background:rgba(237,234,227,.28)}

  .sub{position:absolute;left:96px;top:962px;font-family:'Instr';font-weight:400;
       font-size:32px;letter-spacing:-.012em;color:#EDEAE3}

  .data{position:absolute;left:96px;right:96px;bottom:96px;display:flex;justify-content:space-between;align-items:flex-end}
  .data .col{font-family:'Geist';font-size:12.5px;letter-spacing:.20em;text-transform:uppercase;
             color:rgba(237,234,227,.42);line-height:2.1}
  .data .col b{display:block;font-family:'Shoulders';font-weight:700;font-size:56px;
               letter-spacing:0;color:#EDEAE3;line-height:.9;margin-bottom:10px}
  .mark{position:absolute;top:60px;left:96px;font-family:'Geist';font-weight:700;font-size:12px;
        letter-spacing:.42em;color:rgba(237,234,227,.50)}
  .side{position:absolute;top:60px;right:96px;font-family:'Geist';font-size:12px;
        letter-spacing:.24em;color:rgba(237,234,227,.28)}
</style></head><body>
<div class="a">
  <div class="mark">LINX</div>
  <div class="side">A / 01</div>

  <div class="word">
    <span>D</span><span>E</span><span>A</span><span>D</span><br>
    <span>H</span><span>E</span><span>A</span><span class="solid">D</span>
  </div>

  <div class="rule"></div>
  <div class="sub">The miles you pay for twice.</div>

  <div class="data">
    <div class="col"><b>1 in 4</b>Miles run empty<br>on a typical week</div>
    <div class="col" style="text-align:center"><b>+33%</b>Required on loaded<br>miles just to break even</div>
    <div class="col" style="text-align:right"><b>$0</b>Amount anyone<br>invoices you for it</div>
  </div>
  <div class="grain screen"></div>
</div>
</body></html>
