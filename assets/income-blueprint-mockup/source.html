<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Big Shoulders';
    src: url('fonts/BigShoulders-Bold.ttf') format('truetype');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Big Shoulders';
    src: url('fonts/BigShoulders-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:2400px; height:1350px; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse 1400px 900px at 48% 38%, #faf7f2 0%, #f2ede4 46%, #e8e1d5 78%, #ddd5c6 100%);
    font-family:'Big Shoulders', sans-serif;
    position:relative;
  }

  /* ---------- floor shadow ---------- */
  .floor-shadow{
    position:absolute; left:710px; top:1030px; width:820px; height:150px;
    background: radial-gradient(ellipse at center, rgba(60,52,40,0.38) 0%, rgba(60,52,40,0.22) 32%, rgba(60,52,40,0.09) 60%, rgba(60,52,40,0) 78%);
    filter: blur(6px);
  }
  .floor-shadow-tight{
    position:absolute; left:860px; top:1020px; width:440px; height:60px;
    background: radial-gradient(ellipse at center, rgba(35,30,24,0.36) 0%, rgba(35,30,24,0.16) 50%, rgba(35,30,24,0) 80%);
    filter: blur(3px);
  }

  /* ---------- 3D box: two independently-rotated flat panels sharing one
     perspective, hinged where spine's right edge meets front's left edge.
     (A preserve-3d cube here is fragile under Chromium's depth-sort; this
     flat-panel technique is the robust, industry-standard way to fake a
     hardcover box in pure CSS.) ---------- */
  .scene{
    position:absolute; left:0; top:0; width:2400px; height:1350px;
    perspective:1900px; perspective-origin:58% 40%;
  }
  .book{
    position:absolute; left:850px; top:285px;
    width:670px; height:760px;
  }
  .face{ position:absolute; top:0; }

  /* SPINE (left) */
  .spine{
    left:0;
    width:150px; height:760px;
    transform-origin: 100% 50%;
    transform: rotateX(4deg) rotateY(62deg);
    background: linear-gradient(90deg, #08080a 0%, #0e0e13 55%, #131319 100%);
    box-shadow: inset 0 0 0 1px rgba(216,178,110,0.10);
    overflow:hidden;
  }
  .spine::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(90deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 30%, rgba(255,255,255,0.03) 75%, rgba(0,0,0,0.18) 100%);
  }

  /* FRONT COVER (right) */
  .front{
    left:150px;
    width:520px; height:760px;
    transform-origin: 0% 50%;
    transform: rotateX(4deg) rotateY(-24deg);
    background:
      linear-gradient(128deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 20%),
      linear-gradient(155deg, #14141a 0%, #0c0c10 38%, #08080a 70%, #050506 100%);
    box-shadow: inset 0 0 0 1px rgba(216,178,110,0.14);
    overflow:hidden;
  }
  .front::after{ /* soft directional light sweep */
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(120deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 16%, rgba(255,255,255,0) 34%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.22) 100%);
    pointer-events:none;
  }
  .grain{
    position:absolute; inset:0; opacity:0.05; mix-blend-mode:overlay; pointer-events:none;
  }

  /* thin bronze hairline tracing the top silhouette, sold as the hardcover's top bevel */
  .top-edge{ position:absolute; left:0; top:0; width:670px; height:760px; pointer-events:none; }

  /* ---------- blueprint grid + diagrams on front ---------- */
  .grid-lines{ position:absolute; inset:0; }

  .content-front{
    position:absolute; inset:0;
  }

  .corner{ position:absolute; width:34px; height:34px; }
  .corner svg{ width:100%; height:100%; }
  .corner.tl{ top:26px; left:26px; }
  .corner.tr{ top:26px; right:26px; transform:scaleX(-1); }
  .corner.bl{ bottom:26px; left:26px; transform:scaleY(-1); }
  .corner.br{ bottom:26px; right:26px; transform:scale(-1,-1); }

  .title-wrap{
    position:absolute; top:398px; left:0; width:100%;
    text-align:center;
  }
  .title-line{
    font-weight:700; color:#f4ecdc; text-transform:uppercase;
    line-height:0.92; letter-spacing:1px;
  }
  .title-line.l1{ font-size:46px; letter-spacing:7px; color:#e9c98a; }
  .title-line.l2{ font-size:58px; letter-spacing:0.5px; margin-top:10px; }
  .title-rule{
    width:120px; height:2px; margin:22px auto 0;
    background:linear-gradient(90deg, transparent, #c79a54, transparent);
  }
  .subtitle{
    margin-top:20px; font-size:15px; font-weight:400; letter-spacing:3.4px;
    color:#c9bfa9; text-transform:uppercase;
  }

  .footer-wrap{
    position:absolute; bottom:56px; left:0; width:100%; text-align:center;
  }
  .footer-brand{
    font-size:17px; font-weight:700; letter-spacing:5px; color:#e9c98a;
  }
  .footer-name{
    margin-top:8px; font-size:13px; font-weight:400; letter-spacing:4px; color:#8b8478;
  }
  .footer-line{
    width:60px; height:1px; margin:14px auto; background:#4a4438;
  }

  /* SPINE text */
  .spine-text{
    position:absolute; top:50%; left:50%;
    transform: translate(-50%,-50%) rotate(90deg);
    white-space:nowrap;
    font-size:26px; font-weight:700; letter-spacing:6px; color:#e6d3a4;
  }
  .spine-mark{
    position:absolute; left:50%; top:64px; transform:translateX(-50%);
    width:26px; height:26px; opacity:0.85;
  }
  .spine-mark2{
    position:absolute; left:50%; bottom:64px; transform:translateX(-50%) rotate(180deg);
    width:26px; height:26px; opacity:0.85;
  }
</style>
</head>
<body>

  <div class="floor-shadow"></div>
  <div class="floor-shadow-tight"></div>

  <div class="scene">
    <div class="book">

      <div class="face spine">
        <svg width="150" height="760" style="position:absolute;inset:0;">
          <defs>
            <pattern id="gridSpine" width="26" height="26" patternUnits="userSpaceOnUse">
              <path d="M 26 0 L 0 0 0 26" fill="none" stroke="rgba(201,161,90,0.07)" stroke-width="1"/>
            </pattern>
          </defs>
          <rect width="150" height="760" fill="url(#gridSpine)"/>
          <line x1="1" y1="0" x2="1" y2="760" stroke="rgba(216,178,110,0.30)" stroke-width="1.5"/>
          <line x1="149" y1="0" x2="149" y2="760" stroke="rgba(0,0,0,0.4)" stroke-width="1.5"/>
        </svg>
        <div class="spine-mark">
          <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="none" stroke="#c79a54" stroke-width="1.4"/><line x1="20" y1="7" x2="20" y2="15" stroke="#c79a54" stroke-width="1.4"/><line x1="20" y1="25" x2="20" y2="33" stroke="#c79a54" stroke-width="1.4"/><line x1="7" y1="20" x2="15" y2="20" stroke="#c79a54" stroke-width="1.4"/><line x1="25" y1="20" x2="33" y2="20" stroke="#c79a54" stroke-width="1.4"/></svg>
        </div>
        <div class="spine-text">THE ONLINE INCOME BLUEPRINT</div>
        <div class="spine-mark2">
          <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="none" stroke="#c79a54" stroke-width="1.4"/><line x1="20" y1="7" x2="20" y2="15" stroke="#c79a54" stroke-width="1.4"/><line x1="20" y1="25" x2="20" y2="33" stroke="#c79a54" stroke-width="1.4"/><line x1="7" y1="20" x2="15" y2="20" stroke="#c79a54" stroke-width="1.4"/><line x1="25" y1="20" x2="33" y2="20" stroke="#c79a54" stroke-width="1.4"/></svg>
        </div>
      </div>

      <div class="face front">
        <svg class="grid-lines" width="520" height="760" viewBox="0 0 520 760">
          <defs>
            <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
              <path d="M 26 0 L 0 0 0 26" fill="none" stroke="rgba(201,161,90,0.075)" stroke-width="1"/>
            </pattern>
            <pattern id="gridMajor" width="130" height="130" patternUnits="userSpaceOnUse">
              <path d="M 130 0 L 0 0 0 130" fill="none" stroke="rgba(201,161,90,0.14)" stroke-width="1"/>
            </pattern>
          </defs>
          <rect width="520" height="760" fill="url(#grid)"/>
          <rect width="520" height="760" fill="url(#gridMajor)"/>

          <!-- faint construction diagonals, confined to the upper diagram band -->
          <line x1="0" y1="380" x2="460" y2="55" stroke="rgba(201,161,90,0.09)" stroke-width="1" stroke-dasharray="2 6"/>
          <line x1="30" y1="345" x2="300" y2="24" stroke="rgba(201,161,90,0.07)" stroke-width="1" stroke-dasharray="2 6"/>

          <!-- dimension marks, lower-left margin -->
          <g stroke="rgba(201,161,90,0.30)" stroke-width="1" fill="none">
            <line x1="34" y1="612" x2="34" y2="676"/>
            <line x1="28" y1="612" x2="40" y2="612"/>
            <line x1="28" y1="676" x2="40" y2="676"/>
          </g>
          <text x="44" y="650" font-family="Big Shoulders" font-size="11" letter-spacing="1" fill="rgba(201,161,90,0.42)">12.6 M</text>
          <text x="386" y="46" font-family="Big Shoulders" font-size="10" letter-spacing="2" fill="rgba(201,161,90,0.34)">SCALE 1:50</text>
          <text x="30" y="742" font-family="Big Shoulders" font-size="10" letter-spacing="2" fill="rgba(201,161,90,0.30)">FIG. 01 — PATHWAY ELEVATION</text>

          <!-- ===== focal diagram: blueprint -> ascending pathway (contained above the title band) ===== -->
          <g>
            <!-- faint blueprint construction fan at base -->
            <g stroke="rgba(201,161,90,0.22)" stroke-width="1" fill="none" stroke-dasharray="3 5">
              <line x1="76" y1="344" x2="220" y2="344"/>
              <line x1="76" y1="344" x2="122" y2="292"/>
              <line x1="76" y1="344" x2="168" y2="266"/>
              <line x1="76" y1="344" x2="220" y2="248"/>
            </g>

            <!-- drafting compass, planted at the origin of the pathway -->
            <g transform="translate(96,338) rotate(-8)">
              <path d="M -27 54 A 35 35 0 0 0 26 52" fill="none" stroke="rgba(201,161,90,0.35)" stroke-width="1" stroke-dasharray="1 4"/>
              <line x1="0" y1="0" x2="-27" y2="54" stroke="#c79a54" stroke-width="1.6"/>
              <line x1="0" y1="0" x2="24" y2="52" stroke="#c79a54" stroke-width="1.6"/>
              <line x1="-27" y1="54" x2="-31" y2="62" stroke="#c79a54" stroke-width="1.6"/>
              <line x1="24" y1="52" x2="28" y2="62" stroke="#c79a54" stroke-width="1.2"/>
              <line x1="0" y1="0" x2="0" y2="-15" stroke="#c79a54" stroke-width="1.6"/>
              <circle cx="0" cy="-16" r="2.1" fill="#c79a54"/>
              <circle cx="0" cy="0" r="2.6" fill="#0c0c10" stroke="#d8b26e" stroke-width="1.3"/>
            </g>

            <!-- ascending pathway: dashed blueprint line resolving into a solid gold path -->
            <polyline points="76,344 150,312 150,272 206,272 206,222 263,222 263,166 320,166 320,110 380,70"
                      fill="none" stroke="rgba(201,161,90,0.30)" stroke-width="1.4" stroke-dasharray="1 7" />
            <polyline points="206,272 206,222 263,222 263,166 320,166 320,110 380,70"
                      fill="none" stroke="#c9a15c" stroke-width="2" />
            <polyline points="320,166 320,110 380,70"
                      fill="none" stroke="#e7c584" stroke-width="2.4" />

            <!-- waypoint nodes -->
            <circle cx="150" cy="272" r="2.6" fill="none" stroke="rgba(201,161,90,0.4)" stroke-width="1"/>
            <circle cx="206" cy="222" r="3" fill="none" stroke="#c9a15c" stroke-width="1.3"/>
            <circle cx="263" cy="166" r="3" fill="none" stroke="#c9a15c" stroke-width="1.3"/>
            <circle cx="320" cy="110" r="3.4" fill="none" stroke="#dcb877" stroke-width="1.4"/>
            <circle cx="380" cy="70" r="5.2" fill="#e7c584"/>
            <circle cx="380" cy="70" r="9" fill="none" stroke="rgba(231,197,132,0.5)" stroke-width="1"/>

            <!-- summit rays -->
            <g stroke="rgba(231,197,132,0.45)" stroke-width="1">
              <line x1="380" y1="70" x2="380" y2="49"/>
              <line x1="380" y1="70" x2="399" y2="57"/>
              <line x1="380" y1="70" x2="401" y2="80"/>
            </g>
          </g>
        </svg>

        <div class="corner tl"><svg viewBox="0 0 34 34"><path d="M0 0 L14 0 M0 0 L0 14" stroke="#c79a54" stroke-width="1.5" fill="none"/></svg></div>
        <div class="corner tr"><svg viewBox="0 0 34 34"><path d="M0 0 L14 0 M0 0 L0 14" stroke="#c79a54" stroke-width="1.5" fill="none"/></svg></div>
        <div class="corner bl"><svg viewBox="0 0 34 34"><path d="M0 0 L14 0 M0 0 L0 14" stroke="#c79a54" stroke-width="1.5" fill="none"/></svg></div>
        <div class="corner br"><svg viewBox="0 0 34 34"><path d="M0 0 L14 0 M0 0 L0 14" stroke="#c79a54" stroke-width="1.5" fill="none"/></svg></div>

        <div class="content-front">
          <div class="title-wrap">
            <div class="title-line l1">THE ONLINE</div>
            <div class="title-line l2">INCOME BLUEPRINT</div>
            <div class="title-rule"></div>
            <div class="subtitle">Find the right path. Build with clarity.</div>
          </div>

          <div class="footer-wrap">
            <div class="footer-brand">INCOME ARCHITECTURE™</div>
            <div class="footer-line"></div>
            <div class="footer-name">KALEI POTEAT</div>
          </div>
        </div>

        <svg class="grain" width="520" height="760">
          <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>
          <rect width="520" height="760" filter="url(#noise)"/>
        </svg>
      </div>

    </div>
  </div>

</body>
</html>
