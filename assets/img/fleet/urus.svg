<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Stylised illustration of a black Lamborghini Urus in profile on a dark studio floor">
  <defs>
    <linearGradient id="u-stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101012"/>
      <stop offset="55%" stop-color="#08080a"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="u-spot" cx="50%" cy="72%" r="62%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#c9a227" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="u-body" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#3a3a40"/>
      <stop offset="28%" stop-color="#1a1a1e"/>
      <stop offset="62%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="u-glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#4a4a55"/>
      <stop offset="45%" stop-color="#16161b"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
    <linearGradient id="u-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a6a1f"/>
      <stop offset="35%" stop-color="#f5d98b"/>
      <stop offset="65%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#7a5c18"/>
    </linearGradient>
    <linearGradient id="u-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d98b"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#6d5115"/>
    </linearGradient>
    <linearGradient id="u-reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c20" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#u-stage)"/>
  <rect width="1200" height="750" fill="url(#u-spot)"/>

  <!-- floor line -->
  <ellipse cx="600" cy="592" rx="520" ry="26" fill="#000" opacity="0.75"/>
  <rect x="0" y="590" width="1200" height="160" fill="url(#u-reflect)"/>

  <g>
    <!-- body -->
    <path fill="url(#u-body)" d="M104 566 L102 492 C102 462 116 447 146 440 L268 416 C336 402 396 392 452 384 L488 380 C532 330 580 302 646 298 L806 294 C866 293 908 310 944 342 L1000 390 L1044 402 C1074 411 1088 427 1090 454 L1092 528 L1088 566 Z"/>

    <!-- shoulder highlight -->
    <path fill="none" stroke="url(#u-gold)" stroke-width="2.6" stroke-linecap="round" opacity="0.85" d="M148 440 L268 416 C336 402 396 392 452 384 L488 380 C532 330 580 302 646 298 L806 294 C866 293 908 310 944 342"/>
    <!-- lower crease -->
    <path fill="none" stroke="#c9a227" stroke-width="1.6" opacity="0.35" d="M150 512 L470 494 L900 496 L1078 508"/>

    <!-- glass house -->
    <path fill="url(#u-glass)" d="M512 378 C548 336 592 316 650 313 L700 312 L700 378 Z"/>
    <path fill="url(#u-glass)" d="M716 312 L806 310 C852 309 884 322 912 346 L940 372 L716 372 Z"/>
    <path fill="none" stroke="#c9a227" stroke-width="1.4" opacity="0.4" d="M706 312 L706 372"/>

    <!-- door line -->
    <path fill="none" stroke="#000" stroke-width="2" opacity="0.55" d="M700 384 L698 500"/>
    <path fill="none" stroke="#3a3a40" stroke-width="1" opacity="0.5" d="M702 384 L700 500"/>

    <!-- side intake -->
    <path fill="#050506" d="M986 430 L1064 446 L1062 476 L984 462 Z"/>
    <path fill="none" stroke="#c9a227" stroke-width="1.4" opacity="0.5" d="M986 430 L1064 446 L1062 476 L984 462 Z"/>

    <!-- headlight -->
    <path fill="url(#u-gold)" opacity="0.95" d="M108 458 L186 446 L190 470 L110 480 Z"/>
    <!-- front splitter -->
    <path fill="#0a0a0c" d="M100 548 L214 542 L214 566 L100 566 Z"/>
    <path fill="none" stroke="#c9a227" stroke-width="1.6" opacity="0.55" d="M100 548 L214 542"/>
    <!-- rear light -->
    <path fill="#c9a227" opacity="0.6" d="M1062 424 L1090 430 L1090 452 L1062 446 Z"/>

    <!-- mirror -->
    <path fill="#111114" d="M502 372 L472 364 L468 380 L500 384 Z"/>

    <!-- wheel arches -->
    <path fill="#050506" d="M228 566 A104 104 0 0 1 436 566 Z"/>
    <path fill="#050506" d="M792 566 A104 104 0 0 1 1000 566 Z"/>
  </g>

  <!-- wheels -->
  <g>
    <circle cx="332" cy="566" r="92" fill="#0a0a0c"/>
    <circle cx="332" cy="566" r="92" fill="none" stroke="#26262b" stroke-width="3"/>
    <circle cx="332" cy="566" r="58" fill="#0f0f12" stroke="url(#u-rim)" stroke-width="4"/>
    <g stroke="url(#u-rim)" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <path d="M332 512 L332 620"/><path d="M278 566 L386 566"/>
      <path d="M294 528 L370 604"/><path d="M370 528 L294 604"/>
    </g>
    <circle cx="332" cy="566" r="12" fill="url(#u-rim)"/>

    <circle cx="896" cy="566" r="92" fill="#0a0a0c"/>
    <circle cx="896" cy="566" r="92" fill="none" stroke="#26262b" stroke-width="3"/>
    <circle cx="896" cy="566" r="58" fill="#0f0f12" stroke="url(#u-rim)" stroke-width="4"/>
    <g stroke="url(#u-rim)" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <path d="M896 512 L896 620"/><path d="M842 566 L950 566"/>
      <path d="M858 528 L934 604"/><path d="M934 528 L858 604"/>
    </g>
    <circle cx="896" cy="566" r="12" fill="url(#u-rim)"/>
  </g>

  <!-- ground shadow over wheels -->
  <ellipse cx="600" cy="660" rx="470" ry="18" fill="#000" opacity="0.5"/>
</svg>
