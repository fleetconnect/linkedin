<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Stylised illustration of a black Mercedes-Benz G-Class in profile on a dark studio floor">
  <defs>
    <linearGradient id="g-stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101012"/>
      <stop offset="55%" stop-color="#08080a"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="g-spot" cx="50%" cy="70%" r="62%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#c9a227" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-body" x1="0.1" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#3d3d43"/>
      <stop offset="26%" stop-color="#1b1b1f"/>
      <stop offset="64%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="g-glass" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#4a4a55"/>
      <stop offset="45%" stop-color="#16161b"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a6a1f"/>
      <stop offset="35%" stop-color="#f5d98b"/>
      <stop offset="65%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#7a5c18"/>
    </linearGradient>
    <linearGradient id="g-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d98b"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#6d5115"/>
    </linearGradient>
    <linearGradient id="g-reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c20" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#g-stage)"/>
  <rect width="1200" height="750" fill="url(#g-spot)"/>

  <ellipse cx="600" cy="586" rx="520" ry="26" fill="#000" opacity="0.75"/>
  <rect x="0" y="584" width="1200" height="166" fill="url(#g-reflect)"/>

  <g>
    <!-- boxy body: flat hood, upright glass, squared rear -->
    <path fill="url(#g-body)" d="M132 560 L130 428 C130 414 138 406 154 404 L372 398 L372 276 C372 262 381 254 396 254 L1006 250 C1022 250 1031 258 1031 273 L1034 520 L1032 560 Z"/>

    <!-- roof + belt-line gold rim light -->
    <path fill="none" stroke="url(#g-gold)" stroke-width="2.6" stroke-linecap="round" opacity="0.85" d="M154 404 L372 398 L372 276 C372 262 381 254 396 254 L1006 250 C1022 250 1031 258 1031 273"/>
    <path fill="none" stroke="#c9a227" stroke-width="1.6" opacity="0.3" d="M148 500 L1030 494"/>

    <!-- windshield -->
    <path fill="url(#g-glass)" d="M392 272 L500 271 L500 392 L392 392 Z"/>
    <!-- front door glass -->
    <path fill="url(#g-glass)" d="M520 271 L692 270 L692 392 L520 392 Z"/>
    <!-- rear door glass -->
    <path fill="url(#g-glass)" d="M712 270 L884 269 L884 392 L712 392 Z"/>
    <!-- rear quarter glass -->
    <path fill="url(#g-glass)" d="M904 269 L1014 268 L1014 392 L904 392 Z"/>

    <!-- pillars -->
    <g stroke="#c9a227" stroke-width="1.2" opacity="0.35">
      <path d="M506 271 L506 392"/><path d="M700 270 L700 392"/><path d="M892 269 L892 392"/>
    </g>

    <!-- door seams -->
    <g stroke="#000" stroke-width="2" opacity="0.55">
      <path d="M508 400 L508 552"/><path d="M700 400 L700 552"/>
    </g>
    <!-- door handles -->
    <g fill="url(#g-gold)" opacity="0.9">
      <rect x="600" y="430" width="52" height="8" rx="4"/>
      <rect x="790" y="430" width="52" height="8" rx="4"/>
    </g>

    <!-- round headlight -->
    <circle cx="176" cy="444" r="30" fill="url(#g-gold)" opacity="0.92"/>
    <circle cx="176" cy="444" r="30" fill="none" stroke="#050506" stroke-width="3"/>
    <!-- turn indicator on fender top -->
    <rect x="146" y="386" width="34" height="14" rx="6" fill="#c9a227" opacity="0.65"/>

    <!-- brush guard / bumper -->
    <path fill="#0a0a0c" d="M126 528 L246 526 L246 556 L126 556 Z"/>
    <path fill="none" stroke="#c9a227" stroke-width="1.6" opacity="0.5" d="M126 528 L246 526"/>

    <!-- side step -->
    <rect x="380" y="548" width="600" height="14" rx="6" fill="#0a0a0c"/>
    <rect x="380" y="548" width="600" height="3" rx="2" fill="#c9a227" opacity="0.4"/>

    <!-- mirror -->
    <path fill="#111114" d="M392 300 L352 296 L348 318 L390 320 Z"/>

    <!-- rear spare wheel -->
    <circle cx="1036" cy="392" r="70" fill="#0a0a0c" stroke="#26262b" stroke-width="3"/>
    <circle cx="1036" cy="392" r="40" fill="#0d0d10" stroke="url(#g-rim)" stroke-width="3" opacity="0.85"/>

    <!-- wheel arches (squared, G-Class style) -->
    <path fill="#050506" d="M244 560 L244 486 L438 486 L438 560 Z"/>
    <path fill="#050506" d="M778 560 L778 486 L972 486 L972 560 Z"/>
  </g>

  <!-- wheels -->
  <g>
    <circle cx="341" cy="560" r="88" fill="#0a0a0c"/>
    <circle cx="341" cy="560" r="88" fill="none" stroke="#26262b" stroke-width="3"/>
    <circle cx="341" cy="560" r="54" fill="#0f0f12" stroke="url(#g-rim)" stroke-width="4"/>
    <g stroke="url(#g-rim)" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <path d="M341 510 L341 610"/><path d="M291 560 L391 560"/>
      <path d="M306 525 L376 595"/><path d="M376 525 L306 595"/>
    </g>
    <circle cx="341" cy="560" r="11" fill="url(#g-rim)"/>

    <circle cx="875" cy="560" r="88" fill="#0a0a0c"/>
    <circle cx="875" cy="560" r="88" fill="none" stroke="#26262b" stroke-width="3"/>
    <circle cx="875" cy="560" r="54" fill="#0f0f12" stroke="url(#g-rim)" stroke-width="4"/>
    <g stroke="url(#g-rim)" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <path d="M875 510 L875 610"/><path d="M825 560 L925 560"/>
      <path d="M840 525 L910 595"/><path d="M910 525 L840 595"/>
    </g>
    <circle cx="875" cy="560" r="11" fill="url(#g-rim)"/>
  </g>

  <ellipse cx="600" cy="654" rx="470" ry="18" fill="#000" opacity="0.5"/>
</svg>
